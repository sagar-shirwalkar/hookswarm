spring:
  application:
    name: hookswarm
  netty:
    leak-detection: SIMPLE
  threads:
    virtual:
      enabled: true

  r2dbc:
    url: r2dbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:hookswarm}
    username: ${POSTGRES_USER:hookswarm}
    password: ${POSTGRES_PASSWORD:hookswarm}
    pool:
      initial-size: 10
      max-size: 50
      max-idle-time: 10m
      max-acquire-time: 3s
      max-create-connection-time: 3s
      validation-query: SELECT 1

  flyway:
    enabled: true
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:hookswarm}
    user: ${POSTGRES_USER:hookswarm}
    password: ${POSTGRES_PASSWORD:hookswarm}
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
      indent-output: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  netty:
    connection-timeout: 10s
    max-connections: 10000
    max-initial-line-length: 8KB
    h2c-max-content-length: 10MB

spring.lifecycle:
  timeout-per-shutdown-phase: 30s

hookswarm:
  dragonfly:
    host: dragonfly
    port: 6379
    password: ${DRAGONFLY_PASSWORD:}
    database: 0
    timeout: 5s

  fanout:
    max-pending-deliveries: 10000
    large-subscription-threshold: 100
    normal-stream: deliveries.normal
    large-stream: deliveries.large
    backpressure-delay-ms: 100
    poll-batch-size: 20
    poll-block-timeout-ms: 1500
    concurrency: 4

  delivery:
    poll-batch-size: 20
    poll-block-timeout-ms: 1500
    concurrency: 5
    http-timeout-seconds: 10
    per-endpoint-max-concurrency: 5
    sharding:
      enabled: true
      number-of-shards: 8
      stream-prefix: deliveries.shard

  retry:
    base-delay-seconds: 10
    max-delay-seconds: 3600
    multiplier: 3
    jitter-factor: 0.2

  circuit-breaker:
    failure-threshold: 5
    open-duration-seconds: 60

  recovery:
    stale-threshold-minutes: 5
    interval-ms: 60000
    batch-size: 200

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: hookswarm

logging:
  level:
    dev.hookswarm: DEBUG
    org.springframework.data.r2dbc: DEBUG
    io.r2dbc.postgresql.QUERY: DEBUG
    org.flywaydb: DEBUG
    reactor.netty: DEBUG