spring:
  application:
    name: hookswarm

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/hookswarm
    username: hookswarm
    password: hookswarm

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

hookswarm:
  outbox:
    poll-interval-ms: 500
    batch-size: 100

  delivery:
    poll-interval-ms: 1000
    batch-size: 500
    timeout-connect-seconds: 5
    timeout-request-seconds: 10

  retry:
    base-delay-seconds: 10
    max-delay-seconds: 3600
    multiplier: 3
    jitter-factor: 0.2

  circuit-breaker:
    failure-threshold: 5
    open-duration-seconds: 60

management:
  endpoints:
    web:
      exposure:
        include: health, info