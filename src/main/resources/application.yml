spring:
  application:
    name: hookswarm

  profiles:
    active: dev

  netty:
    leak-detection: SIMPLE

  threads:
    virtual:
      enabled: true

  r2dbc:
    url: r2dbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:hookswarm}
    username: ${POSTGRES_USER:hookswarm}
    password: ${POSTGRES_PASSWORD:hookswarm}
    pool:
      initial-size: 10
      max-size: 50
      max-idle-time: 10m
      max-acquire-time: 3s
      max-create-connection-time: 3s
      validation-query: SELECT 1

  flyway:
    enabled: true
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:hookswarm}
    user: ${POSTGRES_USER:hookswarm}
    password: ${POSTGRES_PASSWORD:hookswarm}
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  data:
    redis:
      host: ${DRAGONFLY_HOST:dragonfly}
      port: ${DRAGONFLY_PORT:6379}
      password: ${DRAGONFLY_PASSWORD:}
      database: 0
      timeout: 2s
      lettuce:
        pool:
          enabled: true
          max-active: 50
          max-idle: 20
          min-idle: 10
          max-wait: 3s
        shutdown-timeout: 100ms

  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
      indent-output: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  netty:
    connection-timeout: 10s
    max-connections: 10000
    max-initial-line-length: 8KB
    h2c-max-content-length: 10MB

spring.lifecycle:
  timeout-per-shutdown-phase: 30s

hookswarm:

  dragonfly:
    host: dragonfly
    port: 6379
    password:
    database: 0
    timeout: 2s

  fanout:
    max-pending-deliveries: 10000
    large-subscription-threshold: 100
    normal-stream: deliveries.normal
    large-stream: deliveries.large
    backpressure-delay-ms: 100
    poll-batch-size: 50
    poll-block-timeout-ms: 1000
    concurrency: 4

  delivery:
    poll-batch-size: 50
    poll-block-timeout-ms: 1000
    concurrency: 50
    http-timeout-seconds: 10
    sharding:
      enabled: true
      number-of-shards: 8
      stream-prefix: "deliveries.shard"

  webclient:
    max-connections: 500
    pending-acquire-timeout: 5s
    max-idle-time: 20s
    max-life-time: 60s
    eviction-interval: 30s

  retry:
    base-delay-seconds: 10
    max-delay-seconds: 3600
    multiplier: 3
    jitter-factor: 0.2

  circuit-breaker:
    failure-threshold: 5
    open-duration-seconds: 60

  recovery:
    stale-threshold-minutes: 5
    interval-ms: 60000
    batch-size: 200

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      instance: ${HOSTNAME:unknown}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 10ms,50ms,100ms,200ms,500ms,1s,2s


logging:
  level:
    root: INFO
    dev.hookswarm: ${LOG_LEVEL:INFO}
    org.springframework.data.r2dbc: WARN
    io.r2dbc.postgresql.QUERY: ${SQL_LOG_LEVEL:WARN}
    org.flywaydb: WARN
    reactor.netty: WARN
    io.lettuce.core: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
